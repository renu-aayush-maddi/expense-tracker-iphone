# Render Blueprint: creates both services from this repo in one go.
# Render dashboard -> New -> Blueprint -> pick this repository.
# Values marked `sync: false` are asked for during setup (they are secrets or
# depend on URLs that only exist after the first deploy).

services:
  # ---------------- Backend: FastAPI (Render Web Service) ----------------
  - type: web
    name: expense-tracker-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Migrations run on every start (safe: Alembic only applies new ones).
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false # Supabase "Session pooler" connection string
      - key: JWT_SECRET
        generateValue: true # Render generates a strong random secret
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: CORS_ORIGINS
        sync: false # e.g. https://expense-tracker-web.onrender.com
      - key: ALLOW_REGISTRATION
        value: "true" # set to "false" after creating your account
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: ENABLE_DOCS
        value: "true"

  # ---------------- Frontend: React (Render Static Site) ----------------
  - type: web
    name: expense-tracker-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    # Single-page app: let React Router handle every path.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    envVars:
      - key: VITE_API_URL
        sync: false # e.g. https://expense-tracker-api.onrender.com
